<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jeme</title>
    
    <!-- SEO Meta Tags -->
    <meta name="description" content="Building the future, one commit at a time.">
    <meta name="keywords" content="software developer, programmer, coding, jeme">
    <meta name="author" content="Jeme">
    <meta name="robots" content="index, follow">
    <meta name="language" content="English">
    <meta name="revisit-after" content="7 days">
    
    <!-- Open Graph Meta Tags -->
    <meta property="og:title" content="Jeme">
    <meta property="og:description" content="Building the future, one commit at a time.">
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://jeme.app">
    <meta property="og:image" content="https://jeme.app/assets/favicon.png">
    <meta property="og:image:width" content="512">
    <meta property="og:image:height" content="512">
    <meta property="og:site_name" content="Jeme">
    <meta property="og:locale" content="en_US">
    
    <!-- Twitter Card Meta Tags -->
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="Jeme">
    <meta name="twitter:description" content="Building the future, one commit at a time.">
    <meta name="twitter:image" content="https://jeme.app/assets/favicon.png">
    <meta name="twitter:creator" content="@TheJeme">
    
    <!-- Additional Meta Tags -->
    <meta name="theme-color" content="#090d0b">
    <meta name="msapplication-TileColor" content="#0a0a0a">
    <meta name="msapplication-config" content="browserconfig.xml">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Jeme">
    
    <!-- Favicon and Icons -->
    <link rel="icon" type="image/png" href="assets/favicon.png">
    <link rel="apple-touch-icon" href="assets/favicon.png">
    <link rel="canonical" href="https://jeme.app">
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@300;400;500;700&display=swap" rel="stylesheet">
</head>
<body>
    <!-- Animated Background -->
    <div class="bg-animation" aria-hidden="true">
        <div class="stars"></div>
        <div class="particles"></div>
    </div>

    <!-- Main Content -->
    <main class="container">
        <!-- Terminal Window -->
        <section class="terminal" aria-label="Jeme's terminal profile">
            <div class="terminal-header">
                <div class="terminal-buttons">
                    <span class="btn close"></span>
                    <span class="btn minimize"></span>
                    <span class="btn maximize"></span>
                </div>
                <div class="terminal-title">jeme@developer:~$</div>
            </div>
            <div class="terminal-body">
                <div class="terminal-line">
                    <span class="prompt">$</span>
                    <span class="command">whoami</span>
                </div>
                <div class="terminal-output">Jeme</div>
                

                <div class="terminal-line">
                    <span class="prompt">$</span>
                    <span class="command">ls -la /</span>
                </div>
                <div class="terminal-output">
                    <div class="project-links">
                        <a href="https://github.com/thejeme" target="_blank" rel="noreferrer" class="project-link">
                            <span class="icon">📁</span> GitHub
                        </a>
                        <a href="https://ailurus.jeme.app/profile/Jeme" target="_blank" rel="noreferrer" class="project-link">
                            <span class="icon">🗄️</span> Ailurus
                        </a>
                        <a href="https://steamcommunity.com/id/thejeme" target="_blank" rel="noreferrer" class="project-link">
                            <span class="icon">🎮</span> Steam
                        </a>
                    </div>
                </div>

                <div class="terminal-line">
                    <span class="prompt">$</span>
                    <span class="command">echo "Building the future, one commit at a time..."</span>
                </div>
                <div class="terminal-output">Building the future, one commit at a time...</div>

                <div class="terminal-line active">
                    <span class="prompt">$</span>
                    <span class="cursor">█</span>
                </div>
            </div>
        </section>

        <!-- Floating Code Elements -->
        <div class="floating-code" aria-hidden="true">
            <div class="code-snippet">&lt;/&gt;</div>
            <div class="code-snippet">{ }</div>
            <div class="code-snippet">function()</div>
            <div class="code-snippet">const</div>
            <div class="code-snippet">import</div>
        </div>

        <!-- Matrix Rain Effect -->
        <canvas id="matrix" class="matrix-rain" aria-hidden="true"></canvas>
    </main>

    <script src="script.js"></script>
</body>
</html>
